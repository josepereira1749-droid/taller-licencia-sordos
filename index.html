d: data.class_id, view: data.view, slideIndex: data.slide_index, quiz: data.quiz, match: data.match, revealed: data.revealed, updatedAt: new Date(data.updated_at).getTime(), resetToken: data.reset_token, interpreteActivo: data.interprete_activo, winner: data.winner, edicion: data.edicion || 'Edición 1' }; }catch(e){ console.error('getSession', e); return {...DEFAULT_SESSION}; }}async function updateSession(patch){ const row = {}; if('classId' in patch) row.class_id = patch.classId; if('view' in patch) row.view = patch.view; if('slideIndex' in patch) row.slide_index = patch.slideIndex; if('quiz' in patch) row.quiz = patch.quiz; if('match' in patch) row.match = patch.match; if('revealed' in patch) row.revealed = patch.revealed; if('resetToken' in patch) row.reset_token = patch.resetToken; if('winner' in patch) row.winner = patch.winner; if('edicion' in patch) row.edicion = patch.edicion; row.updated_at = new Date().toISOString(); try{ await sb.from('sesion').update(row).eq('id', 1); }catch(e){ console.error('updateSession', e); }}async function upsertAlumno(name, whatsapp, rut){ const { data: existente } = await sb.from('alumnos').select('id').eq('whatsapp', whatsapp).maybeSingle(); if(existente){ await sb.from('alumnos').update({ name, rut }).eq('id', existente.id); return existente.id; } const { data, error } = await sb.from('alumnos').insert({ name, whatsapp, rut }).select('id').single(); if(error){ console.error('upsertAlumno', error); return null; } return data.id;}let calendarioListo = null;

// ---------- RUT: normalizar, validar, formatear
function normalizarRut(t){ return String(t || '').toLowerCase().replace(/[^0-9k]/g, ''); }
function rutValidoDV(norm){
  if(!/^[0-9]{7,8}[0-9k]$/.test(norm)) return false;
  const cuerpo = norm.slice(0, -1), dv = norm.slice(-1);
  let suma = 0, mult = 2;
  for(let i = cuerpo.length - 1; i >= 0; i--){ suma += parseInt(cuerpo[i], 10) * mult; mult = mult === 7 ? 2 : mult + 1; }
  const r = 11 - (suma % 11);
  const esperado = r === 11 ? '0' : (r === 10 ? 'k' : String(r));
  return esperado === dv;
}
function formatearRutVisual(norm){
  if(!norm) return '';
  if(norm.length === 1) return norm.toUpperCase();
  return norm.slice(0, -1).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + '-' + norm.slice(-1).toUpperCase();
}
function rutParaGuardar(norm){ return norm.slice(0, -1) + '-' + norm.slice(-1).toUpperCase(); }

function aplicarMascaraRut(input){
  input.setAttribute('inputmode', 'numeric');
  input.setAttribute('autocomplete', 'off');
  input.setAttribute('autocapitalize', 'off');
  input.setAttribute('maxlength', '12');
  input.addEventListener('input', () => {
    let crudo = String(input.value || '').toLowerCase().replace(/[^0-9k]/g, '');
    // La K solo vale como último carácter (dígito verificador) y cuando ya hay 7 números o más.
    const iK = crudo.indexOf('k');
    if(iK !== -1){ crudo = iK >= 7 ? crudo.slice(0, iK + 1) : crudo.slice(0, iK); }
    crudo = crudo.slice(0, 9);
    input.value = formatearRutVisual(crudo);
    input.dispatchEvent(new CustomEvent('rut-cambio', { detail: crudo }));
  });
}
async function buscarAlumnoPorRut(norm){

    const r = await sb.from('alumnos').select('id, name').eq('rut_norm', norm).order('created_at', { ascending: true }).limit(1);
    if(!r.error) return (r.data && r.data[0]) || null;
  }catch(e){ console.error('buscarAlumnoPorRut', e); }
  // Respaldo mientras la columna normalizada no exista: probar los formatos más comunes.
  try{
    const cuerpo = norm.slice(0, -1), dv = norm.slice(-1);
    const puntos = cuerpo.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    const variantes = new Set();
    [dv.toLowerCase(), dv.toUpperCase()].forEach(d => {
      variantes.add(cuerpo + d); variantes.add(cuerpo + '-' + d);
      variantes.add(puntos + '-' + d); variantes.add(puntos + d);
    });
    const r2 = await sb.from('alumnos').select('id, name').in('rut', [...variantes]).order('created_at', { ascending: true }).limit(1);

  return null;

async function eliminarAlumno(id){
  try{
    const { data, error } = await sb.rpc('borrar_alumno', { p_id: id, p_clave: INTERPRETER_PASSWORD });
    if(error){
      const msg = (error.message || '') + ' ' + (error.code || '');
      if(!/clave_incorrecta/.test(msg) && /PGRST202|Could not find the function|borrar_alumno/i.test(msg)) return { ok:false, motivo:'sin_funcion' };
      console.error('eliminarAlumno', error); return { ok:false, motivo:'error' };
    }
    return { ok: data === true };
  }catch(e){ console.error('eliminarAlumno', e); return { ok:false, motivo:'error' }; }
}

async function leerTodoProgreso(armar){
  const out = [];
  for(let desde = 0; ; desde += 1000){
    const { data, error } = await armar().range(desde, desde + 999);
    if(error || !data) break;
    out.push(...data);
    if(data.length < 1000) break;
  }
  return out;
}

    leerTodoProgreso(() => sb.from('manos_historial').select('alumno_id, clase_id').eq('edicion', ed)),

lla se va a actualizar.' : 'No se pudo confirmar tu presencia. Revisa tu conexión a internet e intenta de nuevo.'); } renderStudent(session); }; } }}function renderReview(){ app.innerHTML = ` <div class="review-topbar"> <div class="brand" style="display:flex; align-items:center; gap:10px; font-weight:800; font-size:16px;"> 📋 Revisar todo el contenido </div> <div style="display:flex; align-items:center; gap:14px;"> <button class="exit-btn" id="print-btn">Imprimir / guardar en PDF</button> <button class="exit-btn" id="back-btn">← Volver</button> </div> </div> <div class="wrap" style="max-width:820px;"> <p style="color:var(--ink-soft); font-size:14px; margin:20px 0 24px;"> Aquí están las 12 clases completas: objetivo, contenido y preguntas, con la respuesta correcta marcada. Esta vista es solo para revisar. No cambia lo que ven el intérprete ni los alumnos. </p> <div id="review-list"></div> </div> `; const list = document.getElementById('review-list'); list.innerHTML = CLASES.map(c => { const b = BLOQUES[c.bloque]; const contenidoHTML = c.contenidos.map((item,i) => ` <div class="review-content-item"><span class="n">${i+1}</span><span>${item}</span></div> `).join(''); const preguntasHTML = c.preguntas.length === 0 ? '<p class="empty-note">Esta clase no tiene preguntas.</p>' : c.preguntas.map(p => ` <div class="review-q"> <div class="qtext">${p.q}</div> ${p.opts.map((o,i) => ` <div class="review-opt ${i===p.correct?'correct':''}"> <span class="letter">${String.fromCharCode(65+i)}</span> <span>${o}${i===p.correct ? ' — correcta' : ''}</span> </div>`).join('')} </div>`).join(''); return ` <div class="review-class"> <span class="chip" style="background:${b.color}">${b.label}</span> <h2>Clase ${c.id} — ${c.titulo}</h2> <div class="obj-box" style="margin-top:10px;"><strong>Objetivo</strong>${c.objetivo}</div> <p class="review-sub">Contenido</p> ${contenidoHTML} <p class="review-sub">Preguntas</p> ${preguntasHTML} </div> `; }).join(''); document.getElementById('back-btn').onclick = () => { route='landing'; render(); }; document.getElementById('print-btn').onclick = () => window.print();}let matchLocalState = { key: null, matchedLeft: [], selectedLeft: null };function shuffle(arr){ const a = [...arr]; for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a;}function renderMatchActivity(session, clase, bloque, main){ const match = session.match; if(matchLocalState.key !== match.key){ matchLocalState = { key: match.key, matchedLeft: [], selectedLeft: null, shuffledRight: shuffle(match.pares.map(p => p.right)) }; } const todoCompleto = matchLocalState.matchedLeft.length === match.pares.length; main.innerHTML = ` <span class="chip" style="background:${bloque.color}; align-self:flex-start;">${bloque.label} · Clase ${clase.id}</span> <div class="quiz-q">Une cada concepto con su pareja</div> <div class="match-grid" id="match-left"></div> <div class="match-grid" id="match-right" style="margin-top:0;"></div> <div class="match-progress" id="match-progress-text"></div> `; const leftWrap = document.getElementById('match-left'); const rightWrap = document.getElementById('match-right'); const progressText = document.getElementById('match-progress-text'); function pintar(){ leftWrap.innerHTML = match.pares.map(p => { const matched = matchLocalState.matchedLeft.includes(p.left); const selected = matchLocalState.selectedLeft === p.left; let cls = 'match-btn'; if(matched) cls += ' matched'; else if(selected) cls += ' selected'; return `<button class="${cls}" data-left="${p.left}" ${matched ? 'disabled' : ''}>${p.left}</button>`; }).join(''); rightWrap.innerHTML = matchLocalState.shuffledRight.map(r => { const pareja = match.pares.find(p => p.right === r); const matched = matchLocalState.matchedLeft.includes(pareja.left); let cls = 'match-btn'; if(matched) cls += ' matched'; return `<button class="${cls}" data-right="${r}" ${matched ? 'disabled' : ''}>${r}</button>`; }).join(''); progressText.textContent = todoCompleto ? '¡Completaste toda la actividad! 🎉' : `${matchLocalState.matchedLeft.length} de ${match.pares.length} unidos correctamente`; leftWrap.querySelectorAll('button:not([disabled])').forEach(btn => { btn.onclick = () => { matchLocalState.selectedLeft = btn.dataset.left; pintar(); }; }); rightWrap.querySelectorAll('button:not([disabled])').forEach(btn => { btn.onclick = async () => { if(!matchLocalState.selectedLeft) return; const right = btn.dataset.right; const pareja = match.pares.find(p => p.left === matchLocalState.selectedLeft); if(pareja.right === right){ matchLocalState.matchedLeft.push(matchLocalState.selectedLeft); matchLocalState.selectedLeft = null; pintar(); if(matchLocalState.matchedLeft.length === match.pares.length){ await marcarMatchDone(match.key, studentId, session.edicion); pintar(); } } else { btn.classList.add('wrong'); setTimeout(() => { matchLocalState.selectedLeft = null; pintar(); }, 500); } }; }); } pintar();}document.addEventListener('keydown', (e) => { if (route !== 'interpreter') return; const tag = (e.target && e.target.tagName) || ''; if (tag === 'INPUT' || tag === 'TEXTAREA') return; const NEXT_KEYS = ['ArrowRight', 'ArrowDown', 'PageDown', ' ']; const PREV_KEYS = ['ArrowLeft', 'ArrowUp', 'PageUp']; if (NEXT_KEYS.includes(e.key)) { e.preventDefault(); const btn = document.getElementById('next-slide'); if (btn) btn.click(); } else if (PREV_KEYS.includes(e.key)) { e.preventDefault(); const btn = document.getElementById('prev-slide'); if (btn) btn.click(); }});function iniciarSegunEnlace(){ const params = new URLSearchParams(window.location.search); const rol = params.get('rol'); if(rol === 'interprete'){ const clave = prompt('Ingresa la clave del intérprete:'); if(clave !== INTERPRETER_PASSWORD){ if(clave !== null) alert('Clave incorrecta.'); route = 'landing'; render(); return; } unlockInterpreterAudio(); marcarInterpreteActivo(); route = 'interpreter'; render(); startInterpreterLoop(); } else if(rol === 'alum
