etToken){ entrarComoAlumnoGuardado(alumnoGuardado); } else { borrarAlumnoLocal(); route='join'; render(); } } else { route='join'; render(); } }; document.getElementById('btn-review').onclick = () => { route='review'; render(); };}function renderJoin(){ app.innerHTML = ` <div class="center-wrap"> <div class="join-card"> <span style="font-weight:800;">Pulse Capacitaciones</span> <div class="eyebrow" style="margin-bottom:18px;">📱 Entrada de alumno</div> <label for="name-input">Tu nombre</label> <input id="name-input" type="text" placeholder="Escribe tu nombre" autocomplete="off"> <label for="whatsapp-input">Tu número de WhatsApp</label> <input id="whatsapp-input" type="tel" placeholder="Ej: +56 9 1234 5678" autocomplete="off"> <p class="empty-note" style="margin:-8px 0 16px;">Este número sirve para confirmar tu asistencia en cada clase.</p> <button class="btn teal" style="width:100%; padding:14px;" id="join-btn">Entrar a la clase</button> <button class="review-link" id="join-back-btn" style="margin-top:14px;">← Volver</button> </div> </div> `; const nameInput = document.getElementById('name-input'); const waInput = document.getElementById('whatsapp-input'); document.getElementById('join-btn').onclick = async () => { const name = nameInput.value.trim(); const whatsapp = waInput.value.trim(); if(!name) { nameInput.focus(); return; } if(!whatsapp) { waInput.focus(); return; } studentName = name; studentId = await upsertAlumno(name, whatsapp); if(!studentId){ alert('No se pudo registrar. Revisa tu conexión a internet e intenta de nuevo.'); return; } const sesionActual = await getSession(); await marcarAsistencia(studentId, sesionActual.classId); guardarAlumnoLocal(studentId, name, sesionActual.resetToken); lastKnownClassId = sesionActual.classId; joinedResetToken = sesionActual.resetToken; route = 'student'; render(); startStudentLoop(); }; nameInput.addEventListener('keydown', e => { if(e.key==='Enter') waInput.focus(); }); waInput.addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('join-btn').click(); }); document.getElementById('join-back-btn').onclick = () => { route='landing'; render(); };}let interpreterSession = null;let interpreterVotesTimer = null;let previousHandIds = new Set();let interpreterAudioCtx = null;function unlockInterpreterAudio(){ try{ if(!interpreterAudioCtx){ interpreterAudioCtx = new (window.AudioContext || window.webkitAudioContext)(); } if(interpreterAudioCtx.state === 'suspended'){ interpreterAudioCtx.resume(); } }catch(e){ console.error('audio unlock', e); }}function playHandAlertSound(){ try{ if(!interpreterAudioCtx) return; const ctx = interpreterAudioCtx; const now = ctx.currentTime; [0, 0.18].forEach((offset, i) => { const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(i === 0 ? 880 : 1046.5, now + offset); gain.gain.setValueAtTime(0, now + offset); gain.gain.linearRampToValueAtTime(0.35, now + offset + 0.02); gain.gain.linearRampToValueAtTime(0, now + offset + 0.16); osc.connect(gain); gain.connect(ctx.destination); osc.start(now + offset); osc.stop(now + offset + 0.18); }); }catch(e){ console.error('playHandAlertSound', e); }}function playHandAlertVibration(){ try{ if('vibrate' in navigator){ navigator.vibrate([200, 100, 200]); } }catch(e){} }function triggerHandAlert(){ playHandAlertSound(); playHandAlertVibration(); }async function startInterpreterLoop(){ interpreterSession = await getSession(); previousHandIds = new Set(); renderInterpreter(); if(interpreterVotesTimer) clearInterval(interpreterVotesTimer); interpreterVotesTimer = setInterval(() => { refreshInterpreterVotes(); refreshMatchProgress(); refreshHands(); }, 1200);}async function pushSession(patch){ interpreterSession = {...interpreterSession, ...patch, updatedAt:Date.now()}; await updateSession(patch); pulseBar(); renderInterpreter();}async function refreshInterpreterVotes(){ if(route !== 'interpreter' || !interpreterSession || !interpreterSession.quiz) return; const key = interpreterSession.quiz.key; const [votes, attendance] = await Promise.all([ getVotes(key), getAsistenciaHoy(interpreterSession.classId) ]); const el = document.getElementById('votes-panel'); if(el) el.innerHTML = votesPanelHTML(votes, interpreterSession.quiz, interpreterSession.revealed, attendance);}async function refreshMatchProgress(){ if(route !== 'interpreter' || !interpreterSession || !interpreterSession.match) return; const key = interpreterSession.match.key; const [done, attendance] = await Promise.all([ getMatchDone(key), getAsistenciaHoy(interpreterSession.classId) ]); const el = document.getElementById('votes-panel'); const completados = Object.keys(done).length; if(el){ el.innerHTML = ` <p class="side-title" style="margin-top:0;">Avance de la actividad</p> <p style="font-size:14px; margin:0 0 12px;"><strong>${completados}</strong> de <strong>${attendance.length}</strong> alumnos completaron la actividad.</p> <div class="attend-list"> ${attendance.map(a => `<div class="attend-row"><span>${a.name}</span><span style="color:${done[a.id] ? 'var(--teal-dark)' : 'var(--ink-soft)'}; font-weight:600; font-size:12px;">${done[a.id] ? '✓ Completó' : 'En progreso'}</span></div>`).join('') || '<p class="empty-note">Nadie ha entrado todavía.</p>'} </div> `; }}async function refreshHands(){ if(route !== 'interpreter' || !interpreterSession) return; const hands = await getRaisedHands(interpreterSession.classId); const currentIds = new Set(hands.map(h => h.id)); let hayNueva = false; currentIds.forEach(id => { if(!previousHandIds.has(id)) hayNueva = true; }); if(hayNueva) triggerHandAlert(); previousHandIds = currentIds; const card = document.getElementById('hands-card'); const list = document.getElementById('hands-list'); if(!card || !list) return; if(hands.length === 0){ card.style.display = 'none'; return; } card.style.display = 'block'; list.innerHTML = hands.map(h => ` <div class="attend-row" style="background:var(--surface-accent); border-radius:8px; padding-left:8px; padding-right:8px;"> <span style="font-weight:700;">🖐️ ${h.name}</span> <button class="btn teal" style="padding:4px 10px; font-size:12px;" data-id="${h.id}">Atender</button> </div>`).join(''); list.querySelectorAll('button[data-id]').forEach(btn => { btn.onclick = async () => { await lowerHand(btn.dataset.id); refreshHands(); }; });}function votesPanelHTML(votes, quiz, revealed, attendance){ const voters = votes.voters || {}; const total = Object.keys(voters).length; const barsHTML = quiz.opts.map((opt, i) => { const count = Object.values(voters).filter(v => v === i).length; const pct = total ? Math.round((count/total)*100) : 0; const isCorrect = revealed && i === quiz.correct; return ` <div style="margin-bottom:10px;"> <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:3px;"> <span style="${isCorrect ? 'color:var(--green); font-weight:700;' : ''}">${String.fromCharCode(65+i)}. ${opt}${isCorrect ? ' ✓' : ''}</span> <span class="mono">${count}</span> </div> <div class="bar-wrap"><div class="bar-fill" style="width:${pct}%; ${isCorrect ? 'background:var(--green);' : ''}"></div></div> </div>`; }).join(''); let correctCount = 0, incorrectCount = 0; const studentRows = attendance.map(a => { const chosen = voters[a.id]; let statusHTML, rowStyle = ''; if(chosen === undefined){ statusHTML = `<span style="color:var(--ink-soft); font-size:12px;">Sin responder</span>`; } else { const isCorrect = chosen === quiz.correct; if(isCorrect) correctCount++; else incorrectCount++; if(isCorrect){ rowStyle = 'background:var(--green-bg); border-radius:8px; padding-left:8px; padding-right:8px;'; statusHTML = `<span style="color:var(--green); font-size:13px; font-weight:800;">😃 Correcta</span>`; } else { rowStyle = 'background:var(--red-bg); border-radius:8px; padding-left:8px; padding-right:8px;'; statusHTML = `<span style="color:var(--red); font-size:13px; font-weight:800;">☹️ Incorrecta (${String.fromCharCode(65+chosen)})
