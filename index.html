rprete.'); } renderStudent(session); }; } }}function renderReview(){ app.innerHTML = ` <div class="review-topbar"> <div class="brand" style="display:flex; align-items:center; gap:10px; font-weight:800; font-size:16px;"> 📋 Revisar todo el contenido </div> <div style="display:flex; align-items:center; gap:14px;"> <button class="exit-btn" id="print-btn">Imprimir / guardar en PDF</button> <button class="exit-btn" id="back-btn">← Volver</button> </div> </div> <div class="wrap" style="max-width:820px;"> <p style="color:var(--ink-soft); font-size:14px; margin:20px 0 24px;"> Aquí están las 12 clases completas: objetivo, contenido y preguntas, con la respuesta correcta marcada. Esta vista es solo para revisar. No cambia lo que ven el intérprete ni los alumnos. </p> <div id="review-list"></div> </div> `; const list = document.getElementById('review-list'); list.innerHTML = CLASES.map(c => { const b = BLOQUES[c.bloque]; const contenidoHTML = c.contenidos.map((item,i) => ` <div class="review-content-item"><span class="n">${i+1}</span><span>${item}</span></div> `).join(''); const preguntasHTML = c.preguntas.length === 0 ? '<p class="empty-note">Esta clase no tiene preguntas.</p>' : c.preguntas.map(p => ` <div class="review-q"> <div class="qtext">${p.q}</div> ${p.opts.map((o,i) => ` <div class="review-opt ${i===p.correct?'correct':''}"> <span class="letter">${String.fromCharCode(65+i)}</span> <span>${o}${i===p.correct ? ' — correcta' : ''}</span> </div>`).join('')} </div>`).join(''); return ` <div class="review-class"> <span class="chip" style="background:${b.color}">${b.label}</span> <h2>Clase ${c.id} — ${c.titulo}</h2> <div class="obj-box" style="margin-top:10px;"><strong>Objetivo</strong>${c.objetivo}</div> <p class="review-sub">Contenido</p> ${contenidoHTML} <p class="review-sub">Preguntas</p> ${preguntasHTML} </div> `; }).join(''); document.getElementById('back-btn').onclick = () => { route='landing'; render(); }; document.getElementById('print-btn').onclick = () => window.p
